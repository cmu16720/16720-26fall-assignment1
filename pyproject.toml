[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-16720-pa1"
version = "1.0.0"
description = "Fall 2026 16-720 Computer Vision programming assignment 1"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "opencv-python-headless>=4.8,<5",
  "scikit-image>=0.22,<1",
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "student"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
